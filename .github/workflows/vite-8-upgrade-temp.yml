name: Validate Vite 8 upgrade

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-vite-upgrade:
    if: github.head_ref == 'agent/vite-8'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile for Vite 8
        run: npm install --package-lock-only

      - name: Install upgraded dependency tree
        run: npm ci

      - name: Full security audit
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Persist lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'No lockfile changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Refresh lockfile for Vite 8'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
