name: Persist safe dependency fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  persist-safe-fixes:
    if: github.head_ref == 'agent/dependency-audit'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply compatible audit fixes
        run: npm audit fix --package-lock-only || true

      - name: Verify fixed dependency tree
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Commit safe lockfile changes
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json package.json
          git commit -m 'Apply compatible dependency security updates'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
