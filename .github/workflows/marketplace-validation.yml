name: Marketplace Full Validation

on:
  push:
    branches: [marketplace-operational-v2]
    paths:
      - 'src/**'
      - 'supabase/**'
      - 'public/sitemap.xml'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/marketplace-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Build
        run: npm run build

      - name: Start minimal Supabase stack and apply migrations
        run: npx -y supabase@latest start -x studio,imgproxy,realtime,storage-api,edge-runtime,logflare,vector,supavisor,mailpit,postgres-meta

      - name: Rebuild database from migrations
        run: npx -y supabase@latest db reset --local --no-seed

      - name: Database lint
        run: npx -y supabase@latest db lint --local --level warning

      - name: Stop local Supabase
        if: always()
        run: npx -y supabase@latest stop --no-backup || true
