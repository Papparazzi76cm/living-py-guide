name: Update Browserslist database

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update-browserslist:
    if: github.head_ref == 'agent/asset-quality-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update Browserslist database
        run: npx update-browserslist-db@latest

      - name: Install updated dependency tree
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Persist Browserslist lockfile update
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo 'Browserslist database is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json package.json
          git commit -m 'Update Browserslist database'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
