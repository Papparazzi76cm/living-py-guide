name: Optimize logo asset

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  optimize-logo:
    if: github.head_ref == 'agent/asset-quality-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inspect logo references
        shell: bash
        run: |
          echo '=== LOGO REFERENCES ==='
          grep -R "@/assets/logo.png" -n src || true

      - name: Optimize logo conservatively
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path('src/assets/logo.png')
          before = path.stat().st_size

          with Image.open(path) as source:
              source.load()
              width, height = source.size
              print(f'Original: {width}x{height}, mode={source.mode}, bytes={before}')

              max_height = 384
              has_alpha = source.mode in ('RGBA', 'LA') or 'transparency' in source.info
              working = source.convert('RGBA' if has_alpha else 'RGB')

              if height > max_height:
                  new_width = max(1, round(width * max_height / height))
                  working = working.resize((new_width, max_height), Image.Resampling.LANCZOS)

              working.save(path, format='PNG', optimize=True, compress_level=9)

          after = path.stat().st_size
          with Image.open(path) as result:
              print(f'Optimized: {result.width}x{result.height}, mode={result.mode}, bytes={after}')
          reduction = 1 - (after / before)
          print(f'Reduction: {reduction:.1%}')

          if after >= before:
              raise SystemExit('Optimized asset is not smaller; refusing to persist it.')
          if reduction < 0.25:
              raise SystemExit('Reduction is below 25%; refusing a low-value asset change.')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Commit optimized logo
        shell: bash
        run: |
          if git diff --quiet -- src/assets/logo.png; then
            echo 'No logo changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/assets/logo.png
          git commit -m 'Optimize Living Paraguay logo asset'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
